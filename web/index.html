<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ArthaNiti - AI Economic Policy Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body class="landing-page">
    
    <!-- Top Navigation -->
    <header class="top-nav landing-nav">
      <div class="brand">
        <h1>ArthaNiti</h1>
      </div>
      <div class="user-info-pill" id="user-info-panel">
        <!-- Populated by JS -->
      </div>
    </header>

    <main class="landing-main">
      <div class="hero-content">
        <h1 class="hero-title">How can I help you navigate the economy today?</h1>
        <p class="hero-subtitle">Ask about policy changes, macro shifts, or welfare impacts. Powered by our deterministic Multi-Agent System.</p>
        
        <div class="chat-input-area hero-input">
          <form id="landing-form" class="chat-form landing-form">
            <textarea id="landing-input" placeholder="e.g. What happens if we increase agricultural subsidies?" rows="1" required autofocus></textarea>
            <button type="submit" id="landing-send-btn" class="send-btn" title="Send Query">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M22 2L11 13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M22 2L15 22L11 13L2 9L22 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </form>
        </div>

        <div class="suggestion-chips">
          <button class="chip">Increase corporate taxes by 5%</button>
          <button class="chip">Boost infrastructure capex</button>
          <button class="chip">Cut welfare spending</button>
        </div>
      </div>
    </main>

    <script type="module">
      import { initLanding } from '/app.js';
      initLanding();
    </script>
  </body>
</html>
